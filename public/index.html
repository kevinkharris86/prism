<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PRISM Keys</title>
<style>
:root{--bg:#07060f;--bg2:#0e0c1c;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--tx:#ecebff;--mute:#9a97c0;--acc:#ff4fd8;--acc2:#4fd8ff;--good:#5dff9b;--bad:#ff4f6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button,select,input{font:inherit;color:inherit}
button{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-height:36px;cursor:pointer;transition:background .12s,box-shadow .12s,border-color .12s}
button:active{transform:translateY(1px)}
select{background:#16132b;border:1px solid var(--line);border-radius:10px;padding:7px 8px;min-height:36px;max-width:100%}
input[type=number]{background:#16132b;border:1px solid var(--line);border-radius:8px;padding:6px;width:62px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c,var(--acc)),rgba(255,255,255,.12))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 0 10px var(--c,var(--acc))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
#app{display:grid;grid-template-columns:74px 1fr;grid-template-rows:52px 1fr auto;height:100dvh;height:100vh}
@supports(height:100dvh){#app{height:100dvh}}
header{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#120d26,#07060f 60%,#0b1424);overflow:hidden}
.logo{font-weight:900;letter-spacing:.18em;font-size:17px;background:linear-gradient(90deg,#ff4fd8,#ffd84f,#4fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo small{display:block;font-size:9px;letter-spacing:.25em;color:var(--mute);-webkit-text-fill-color:var(--mute)}
.conn{display:flex;align-items:center;gap:7px;white-space:nowrap;max-width:190px;overflow:hidden}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);flex:none}
.conn.ok .dot{background:var(--good);box-shadow:0 0 10px var(--good)}
.conn.prev .dot{background:#ffd84f;box-shadow:0 0 10px #ffd84f}
.tempo{display:flex;align-items:center;gap:4px}
.tempo button{min-width:34px;padding:6px}
#tempoVal{min-width:58px;text-align:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
#tempoVal small{display:block;font-size:9px;color:var(--mute);font-weight:500}
#beatDot{width:9px;height:9px;border-radius:50%;background:#333;flex:none}
#beatDot.on{background:#ffd84f;box-shadow:0 0 12px #ffd84f}
.scenes{display:flex;gap:4px;margin-left:auto;align-items:center}
.scn{width:34px;padding:0;font-weight:800}
.scn.has{border-color:rgba(79,216,255,.6);background:rgba(79,216,255,.12)}
.scn.cur{background:var(--acc2);color:#000}
.scenes.save .scn{border-color:#ffd84f;animation:pulse 1s infinite}
.scenes.morph .scn.has{border-color:#b48cff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 12px currentColor}}
.mode.on{background:#ffd84f;color:#000}
#panic{background:linear-gradient(180deg,#ff4f6a,#b0122d);border:0;font-weight:900;letter-spacing:.06em}
nav{grid-row:2/4;display:flex;flex-direction:column;gap:4px;padding:6px;border-right:1px solid var(--line);background:var(--bg2);overflow:auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:10.5px;border-color:transparent;background:transparent;flex:1;max-height:76px}
nav button b{font-size:21px;line-height:1.1}
nav button.on{background:rgba(255,79,216,.14);border-color:rgba(255,79,216,.45);box-shadow:inset 3px 0 0 var(--acc)}
main{position:relative;overflow:hidden;min-height:0}
.tab{position:absolute;inset:0;overflow:auto;padding:10px;display:none}
.tab.on{display:block}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative;--c:var(--acc)}
.card>.ch{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--c)}
.card>.ch .sp{flex:1}
.hint{color:var(--mute);font-size:12px;margin:4px 0 8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.row>label{color:var(--mute);font-size:12px;min-width:64px}
.rng{display:grid;grid-template-columns:92px 1fr 42px;align-items:center;gap:6px;font-size:12px}
.rng .rl{color:var(--mute)}
.rng .rv{text-align:right;font-variant-numeric:tabular-nums}
.tog{font-weight:700}
.tog.on{background:var(--c,var(--acc));color:#000;border-color:transparent;box-shadow:0 0 14px color-mix(in srgb,var(--c,var(--acc)) 60%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:5px 9px;min-height:32px;font-size:12px;border-radius:16px}
.chip.on{background:var(--c,var(--acc));color:#000;border-color:transparent}
.vsel{width:100%}
.big{font-size:15px;padding:10px 14px}
/* stage */
.stage{display:grid;grid-template-columns:1fr minmax(230px,36%);gap:10px;height:100%}
.vizbox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 120%,#1d1240,#07060f 70%);min-height:220px}
#viz{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;left:14px;top:10px;right:14px;pointer-events:none}
#chordName{font-size:54px;font-weight:900;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,79,216,.6);line-height:1}
#keyName{color:var(--mute);margin-top:4px;font-size:14px}
#mindState{margin-top:4px;font-size:13px;color:#ff8fa3;min-height:1em}
.quick{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:5px}
.quick button{background:rgba(10,8,25,.75);backdrop-filter:blur(6px);font-size:12px;padding:6px 10px}
.xybox{display:flex;flex-direction:column;gap:6px;min-height:0}
#xy{position:relative;flex:1;min-height:190px;border-radius:16px;border:1px solid var(--line);background:
 radial-gradient(circle at 0 0,rgba(255,79,216,.35),transparent 55%),radial-gradient(circle at 100% 0,rgba(79,216,255,.35),transparent 55%),
 radial-gradient(circle at 0 100%,rgba(255,216,79,.3),transparent 55%),radial-gradient(circle at 100% 100%,rgba(125,255,79,.3),transparent 55%),#0b0918;touch-action:none;overflow:hidden}
#xy::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:12.5% 12.5%}
#xydot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 22px #fff,inset 0 0 12px #fff;pointer-events:none;left:50%;top:50%}
.corner{position:absolute;font-size:11px;font-weight:700;padding:6px 8px;pointer-events:none;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner.tl{left:0;top:0;color:#ff8fe6}.corner.tr{right:0;top:0;color:#8fe6ff;text-align:right}.corner.bl{left:0;bottom:0;color:#ffe68f}.corner.br{right:0;bottom:0;color:#b4ff8f;text-align:right}
/* fusion */
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lay.off{opacity:.55}
/* drums */
.dgrid{display:grid;grid-template-columns:62px repeat(16,1fr);gap:3px;margin-top:8px}
.dgrid .lbl{font-size:11px;padding:0 4px;min-height:30px}
.cell{min-height:30px;padding:0;border-radius:6px;background:rgba(255,255,255,.06)}
.cell.q{background:rgba(255,255,255,.11)}
.cell.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.cell.ph{outline:2px solid #fff}
/* looper */
.ltrack{display:grid;grid-template-columns:84px 1fr auto auto;gap:6px;align-items:center;margin:6px 0}
.lbtn{font-weight:900;min-height:48px}
.lbtn.rec{background:#ff4f6a;color:#fff;animation:pulse .8s infinite}
.lbtn.armed{background:#ffd84f;color:#000;animation:pulse .5s infinite}
.lbtn.play{background:#5dff9b;color:#000}
.lprog{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.lprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd8ff,#ff4fd8)}
/* lab */
.labwrap{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.4fr) minmax(220px,1fr);gap:10px;align-items:start}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.lib{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.libi{display:flex;gap:4px;align-items:center;padding:4px;border-radius:9px;background:rgba(255,255,255,.04)}
.libi.sel{outline:2px solid #ffd84f}
.libi span{flex:1;font-size:12px}
.libi button{min-height:30px;padding:3px 8px;font-size:12px}
/* keyboard */
footer{grid-column:2;border-top:1px solid var(--line);background:#05040b}
footer.hid #kb{display:none}
.kbctl{display:flex;gap:6px;align-items:center;padding:4px 8px;font-size:12px;color:var(--mute)}
.kbctl button{min-height:28px;padding:2px 10px}
#kb{position:relative;height:104px;touch-action:none;margin:0 6px 6px}
.wk,.bk{position:absolute;top:0;border-radius:0 0 7px 7px}
.wk{height:100%;background:linear-gradient(#f4f2ff,#cfcbe8);border:1px solid #2a2640}
.bk{height:62%;background:linear-gradient(#2b2745,#0b0a14);border:1px solid #000;z-index:2}
.wk.lit{background:linear-gradient(#ffd0f4,#ff4fd8);box-shadow:0 0 18px #ff4fd8}
.bk.lit{background:linear-gradient(#7a3a70,#ff4fd8);box-shadow:0 0 18px #ff4fd8}
.wk.hw{background:linear-gradient(#d0f7ff,#4fd8ff)}
.bk.hw{background:linear-gradient(#245a66,#4fd8ff)}
.wk i{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;color:#6a668a}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#1d1838;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center;box-shadow:0 0 30px rgba(255,79,216,.35)}
#toast.on{opacity:1}
#mon{font:11px/1.35 ui-monospace,Consolas,monospace;max-height:220px;overflow:auto;background:#05040b;border-radius:10px;padding:8px;color:#9fe;white-space:pre}
.warn{color:#ffd84f}
kbd{background:#221d3d;border-radius:5px;padding:1px 6px;font-size:12px}
.pbtn{font-size:14px;padding:8px 12px;min-height:40px}
.blast{width:100%;height:240px;border-radius:12px;margin-top:8px;display:none;background:#07060f}
.ta,.tin{width:100%;background:#16132b;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--tx);font:inherit;resize:vertical;user-select:text;-webkit-user-select:text}
.tin{width:auto}
.decoded{font-size:20px;font-weight:800;min-height:1.4em;padding:8px;border-radius:10px;background:#05040b;margin:6px 0;user-select:text;-webkit-user-select:text;word-break:break-word}
.calmbox{position:relative;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#calmDot{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#8cb4ff,#4f5fff 60%,transparent 72%);transform:scale(.35);opacity:.8}
#calmTx{position:relative;font-size:20px;font-weight:800;text-shadow:0 0 12px #000}
#calmCyc{position:relative;margin-top:120px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:rgba(255,255,255,.05);border-radius:10px;padding:8px;text-align:center}.tile b{display:block;font-size:20px}.tile span{font-size:11px;color:var(--mute)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:110px;margin-top:10px;align-items:end}
.bars>div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.bars i{display:block;width:70%;min-height:2px;background:linear-gradient(#3dffc8,#4fd8ff);border-radius:4px 4px 0 0}
.heat{display:flex;gap:1px;height:26px}.heat i{flex:1;background:#3dffc8;border-radius:2px}
#pager{position:fixed;inset:0;z-index:40;background:#fdfdfb;display:none;flex-direction:column}#pager.on{display:flex}
.pgbar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#07060f;flex-wrap:wrap}.pgbar #pgNum{font-weight:800;margin-right:auto}
#pgBox{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;overflow:hidden;touch-action:pan-y}
#pgBox img,#pgBox canvas{box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff}
#light{position:fixed;inset:0;z-index:45;display:none;background:#000}#light.on{display:block}#lightCv{width:100%;height:100%;display:block}
.lighthint{position:absolute;bottom:12px;width:100%;text-align:center;color:rgba(255,255,255,.35);font-size:12px;pointer-events:none}
#alarmOv{position:fixed;inset:0;z-index:48;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#3a2a00,#07060f 70%)}#alarmOv.on{display:flex}
.alarmIn{text-align:center}.alarmIn h2{font-size:34px;margin:6px}
@media (max-width:760px){.stage{grid-template-columns:1fr;height:auto}.vizbox{height:300px}#xy{min-height:260px}.labwrap{grid-template-columns:1fr}#app{grid-template-columns:58px 1fr}nav button{font-size:9px}.scenes .scn:nth-child(n+5){display:none}.logo{display:none}}
@media (max-width:1000px){.logo small{display:none}.scn{width:28px}.scenes{gap:3px}header{gap:6px}.tempo button{min-width:30px}}
.conn{flex-shrink:0}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">PRISM<small>DGX-660 DECK</small></div>
  <button class="conn" id="connBtn"><i class="dot"></i><span id="connText">Connect</span></button>
  <div class="tempo">
    <button id="tDown">−</button><div id="tempoVal">110<small>BPM</small></div><button id="tUp">+</button>
    <button id="tapBtn">TAP</button><i id="beatDot"></i>
  </div>
  <div class="scenes" id="scenes"></div>
  <button class="mode" id="saveMode">SAVE</button>
  <button class="mode" id="morphMode">MORPH</button>
  <button id="panic">PANIC</button>
</header>
<nav id="rail"></nav>
<main>
  <section class="tab on" id="tab-stage">
    <div class="stage">
      <div class="vizbox"><canvas id="viz"></canvas>
        <div class="ov"><div id="chordName">PRISM</div><div id="keyName">Play something…</div><div id="mindState"></div></div>
        <div class="quick" id="quick"></div>
      </div>
      <div class="xybox">
        <div class="row" id="xyHead" style="margin:0"></div>
        <div id="xy"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div id="xydot"></div></div>
      </div>
    </div>
  </section>
  <section class="tab" id="tab-fusion"></section>
  <section class="tab" id="tab-lab"></section>
  <section class="tab" id="tab-perform"></section>
  <section class="tab" id="tab-loops"></section>
  <section class="tab" id="tab-magic"></section>
  <section class="tab" id="tab-auto"></section>
  <section class="tab" id="tab-beyond"></section>
  <section class="tab" id="tab-setup"></section>
</main>
<footer id="kbWrap">
  <div class="kbctl"><button id="kbDown">◀ Oct</button><span id="kbLbl">C4</span><button id="kbUp">Oct ▶</button>
  <span style="flex:1">Touch keys: higher on the key = softer · plays through PRISM's engine</span><button id="kbHide">Hide keys</button></div>
  <div id="kb"></div>
</footer>
</div>
<div id="toast"></div>
<div id="pager"><div class="pgbar"><button id="pgPrev">◀ Back</button><span id="pgNum"></span><span class="hint" style="margin:0">Pedal double-tap or C8 = next · B7 = back</span><button id="pgNext">Next ▶</button><button id="pgClose">✕ Close</button></div><div id="pgBox"></div></div>
<div id="light"><canvas id="lightCv"></canvas><div class="lighthint">Tap to exit</div></div>
<div id="alarmOv"><div class="alarmIn"><div style="font-size:64px">⏰</div><h2>Good morning!</h2><p>Play any key on the piano to stop the music</p><div class="row" style="justify-content:center"><button class="big" id="alStop">Stop</button><button class="big" id="alSnooze">Snooze 5 min</button></div></div></div>
<script>
'use strict';
/* =====================================================================
   PRISM — creative MIDI command deck for the Yamaha DGX-660
   Only standard MIDI messages are used (notes, CC, program change, RPN/NRPN,
   GM/XG system-exclusive for global effects). Nothing writes to the
   keyboard's memory; power-cycling the piano always returns it to normal.
   PRISM plays its own parts on MIDI channels 4–16 so your panel voice
   (what you hear from the keys) stays exactly as you set it on the piano.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName=n=>NN[((n%12)+12)%12]+(Math.floor(n/12)-1);
const now=()=>performance.now();

const GM=['Acoustic Grand Piano','Bright Piano','Electric Grand','Honky-tonk Piano','Electric Piano 1','Electric Piano 2','Harpsichord','Clavinet',
'Celesta','Glockenspiel','Music Box','Vibraphone','Marimba','Xylophone','Tubular Bells','Dulcimer',
'Drawbar Organ','Percussive Organ','Rock Organ','Church Organ','Reed Organ','Accordion','Harmonica','Tango Accordion',
'Nylon Guitar','Steel Guitar','Jazz Guitar','Clean Guitar','Muted Guitar','Overdrive Guitar','Distortion Guitar','Guitar Harmonics',
'Acoustic Bass','Finger Bass','Pick Bass','Fretless Bass','Slap Bass 1','Slap Bass 2','Synth Bass 1','Synth Bass 2',
'Violin','Viola','Cello','Contrabass','Tremolo Strings','Pizzicato Strings','Orchestral Harp','Timpani',
'String Ensemble 1','String Ensemble 2','Synth Strings 1','Synth Strings 2','Choir Aahs','Voice Oohs','Synth Voice','Orchestra Hit',
'Trumpet','Trombone','Tuba','Muted Trumpet','French Horn','Brass Section','Synth Brass 1','Synth Brass 2',
'Soprano Sax','Alto Sax','Tenor Sax','Baritone Sax','Oboe','English Horn','Bassoon','Clarinet',
'Piccolo','Flute','Recorder','Pan Flute','Blown Bottle','Shakuhachi','Whistle','Ocarina',
'Square Lead','Saw Lead','Calliope Lead','Chiff Lead','Charang Lead','Voice Lead','Fifths Lead','Bass + Lead',
'New Age Pad','Warm Pad','Polysynth Pad','Choir Pad','Bowed Pad','Metallic Pad','Halo Pad','Sweep Pad',
'Rain','Soundtrack','Crystal','Atmosphere','Brightness','Goblins','Echoes','Sci-Fi',
'Sitar','Banjo','Shamisen','Koto','Kalimba','Bagpipe','Fiddle','Shanai',
'Tinkle Bell','Agogo','Steel Drums','Woodblock','Taiko Drum','Melodic Tom','Synth Drum','Reverse Cymbal',
'Guitar Fret Noise','Breath Noise','Seashore','Bird Tweet','Telephone','Helicopter','Applause','Gunshot'];
const FAM=['Piano','Chromatic Perc','Organ','Guitar','Bass','Strings','Ensemble','Brass','Reed','Pipe','Synth Lead','Synth Pad','Synth FX','Ethnic','Percussive','Sound FX'];
const KITS=[[0,'Standard Kit'],[8,'Room Kit'],[16,'Rock Kit'],[24,'Electro Kit'],[25,'Analog Kit'],[32,'Jazz Kit'],[40,'Brush Kit'],[48,'Orchestra Kit']];

/* ---------- channels (0-based). 1–3 are left for the keyboard's own parts ---------- */
const CH={util:0,bass:1,comp:2,A:3,B:4,C:5,D:6,arp:7,harm:8,drums:9,echo:10,loop1:11,loop2:12,loop3:13,mind:14,aura:15};
const LAYER_IDS=['A','B','C','D'];
const PART_IDS=['A','B','C','D','arp','harm','echo','mind','aura','loop1','loop2','loop3','bass','comp','util'];
const PART_LABEL={A:'Layer A',B:'Layer B',C:'Layer C',D:'Layer D',arp:'Arpeggiator',harm:'Harmonizer',echo:'Shimmer Echo',mind:'Echo Mind',aura:'Aura',loop1:'Loop 1',loop2:'Loop 2',loop3:'Loop 3',bass:'Band bass',comp:'Band chords',util:'Utility voice'};

const MIDI={access:null,in:null,out:null,sysex:false};
const sounding=new Map();
const MON=[];
function mon(dir,b){const hex=[...b].map(x=>x.toString(16).padStart(2,'0')).join(' ');MON.push(dir+' '+hex+'  '+describe(b));if(MON.length>60)MON.shift();if(UI.monVisible)renderMon()}
function describe(b){const t=b[0]&0xF0,c=(b[0]&15)+1;
  if(b[0]===0xF0)return'SysEx';if(t===0x90)return b[2]?`ch${c} Note On ${noteName(b[1])} v${b[2]}`:`ch${c} Note Off ${noteName(b[1])}`;
  if(t===0x80)return`ch${c} Note Off ${noteName(b[1])}`;if(t===0xB0)return`ch${c} CC${b[1]}=${b[2]}`;if(t===0xC0)return`ch${c} Program ${b[1]+1}`;
  if(t===0xE0)return`ch${c} Pitch Bend`;if(b[0]===0xFA)return'Start';if(b[0]===0xFC)return'Stop';return''}
function send(b){
  if(MIDI.out){try{MIDI.out.send(b)}catch(e){console.warn(e)}}
  if(!MIDI.out||S.setup.preview)Synth.handle(b);
  if(UI.monVisible&&b[0]!==0xF8)mon('→',b);
}
function noteOn(ch,n,v){n=Math.round(n);if(n<0||n>127)return;v=clamp(Math.round(v),1,127);send([0x90|ch,n,v]);const k=ch*128+n;sounding.set(k,(sounding.get(k)||0)+1);Viz.note(ch,n,v)}
function noteOff(ch,n){n=Math.round(n);if(n<0||n>127)return;send([0x80|ch,n,64]);const k=ch*128+n,c=(sounding.get(k)||0)-1;c<=0?sounding.delete(k):sounding.set(k,c)}
function cc(ch,c,v){send([0xB0|ch,c,clamp(Math.round(v),0,127)])}
function pc(ch,p){send([0xC0|ch,clamp(p,0,127)])}
function bend(ch,v){v=clamp(Math.round(v),0,16383);send([0xE0|ch,v&127,v>>7])}
function setVoice(ch,prog,msb=0,lsb=0){cc(ch,0,msb);cc(ch,32,lsb);pc(ch,prog)}
function nrpn(ch,m,l,v){cc(ch,99,m);cc(ch,98,l);cc(ch,6,v);cc(ch,99,127);cc(ch,98,127)}
function rpn(ch,m,l,v,lsb){cc(ch,101,m);cc(ch,100,l);cc(ch,6,v);if(lsb!=null)cc(ch,38,lsb);cc(ch,101,127);cc(ch,100,127)}
function sysex(arr){if(!MIDI.sysex&&MIDI.out){return false}send(arr);return true}
const ccCache=new Map();
function ccT(ch,c,v){v=clamp(Math.round(v),0,127);const k=ch*128+c;if(ccCache.get(k)===v)return;ccCache.set(k,v);cc(ch,c,v)}
const pbCache=new Map();
function bendT(ch,v){v=Math.round(v);if(pbCache.get(ch)===v)return;pbCache.set(ch,v);bend(ch,v)}

/* part parameter → MIDI message mapping (GM2 / XG sound controllers) */
const PARAM_SEND={
  vol:(c,v)=>cc(c,7,v), pan:(c,v)=>cc(c,10,v),
  cutoff:(c,v)=>cc(c,74,v), res:(c,v)=>cc(c,71,v), atk:(c,v)=>cc(c,73,v), rel:(c,v)=>cc(c,72,v),
  dec:(c,v)=>{cc(c,75,v);nrpn(c,1,0x64,v)}, vibRate:(c,v)=>{cc(c,76,v);nrpn(c,1,8,v)}, vibDepth:(c,v)=>{cc(c,77,v);nrpn(c,1,9,v)}, vibDelay:(c,v)=>{cc(c,78,v);nrpn(c,1,10,v)},
  rev:(c,v)=>cc(c,91,v), cho:(c,v)=>cc(c,93,v),
  detune:(c,v)=>{const x=clamp(Math.round(8192+v/100*8191),0,16383);rpn(c,0,1,x>>7,x&127)},
  porta:(c,v)=>{cc(c,65,v>0?127:0);cc(c,5,v)},
  bendRange:(c,v)=>rpn(c,0,0,v,0)

const PARAM_KEYS=Object.keys(PARAM_SEND);
function sendParam(id,key){const c=CH[id];ccCache.delete(c*128+({cutoff:74,res:71,rev:91,cho:93}[key]||0));PARAM_SEND[key](c,S.parts[id][key])}
function applyPart(id){const p=S.parts[id],c=CH[id];setVoice(c,p.prog,p.msb,p.lsb);PARAM_KEYS.forEach(k=>PARAM_SEND[k](c,p[k]));cc(c,11,127);ccCache.delete(c*128+11)}

/* =====================================================================
   MIDI CONNECTION
   ===================================================================== */
async function connectMIDI(){
  if(!navigator.requestMIDIAccess){toast('This browser has no Web MIDI. Use Chrome on the tablet, opened over https.',5000);setConn();return}
  try{MIDI.access=await navigator.requestMIDIAccess({sysex:true});MIDI.sysex=true}
  catch(e){try{MIDI.access=await navigator.requestMIDIAccess();MIDI.sysex=false;toast('Connected without SysEx — global effects disabled')}catch(e2){toast('MIDI permission was blocked. Tap the lock icon → Site settings → allow MIDI.',5000);return}}
  try{localStorage.setItem('prism.autoconnect','1')}catch(e){}
  MIDI.access.onstatechange=()=>refreshPorts(false);
  refreshPorts(true);
}
function preferred(ports){return ports.find(p=>/dgx|digital ?keyboard|yamaha/i.test(p.name))||ports.find(p=>!/through|thru|microsoft|gs wavetable/i.test(p.name))||ports[0]}
function refreshPorts(initial){
  const ins=[...MIDI.access.inputs.values()],outs=[...MIDI.access.outputs.values()];
  const fill=(sel,list,cur)=>{if(!sel)return;sel.innerHTML='';sel.append(h('option',{value:''},'— none —'));list.forEach(p=>sel.append(h('option',{value:p.id},p.name)));sel.value=cur||''};
  if(!MIDI.in||!ins.includes(MIDI.in))bindInput(preferred(ins));
  if(!MIDI.out||!outs.includes(MIDI.out))bindOutput(preferred(outs),initial);
  fill($('#selIn'),ins,MIDI.in&&MIDI.in.id);fill($('#selOut'),outs,MIDI.out&&MIDI.out.id);
  setConn();
}
function bindInput(p){if(MIDI.in)MIDI.in.onmidimessage=null;MIDI.in=p||null;if(MIDI.in)MIDI.in.onmidimessage=onMidiIn}
function bindOutput(p){const was=MIDI.out;MIDI.out=p||null;if(MIDI.out&&MIDI.out!==was){later(150,()=>{applyAll();toast('🎹 Connected to '+MIDI.out.name)})}}
function setConn(){const b=$('#connBtn');b.classList.toggle('ok',!!MIDI.out);b.classList.toggle('prev',!MIDI.out);
  $('#connText').textContent=MIDI.out?MIDI.out.name.replace(/-\d+$/,''):(MIDI.access?'No keyboard found':'Connect');if(UI.syncSetup)UI.syncSetup()}

function inputAccepts(ch){const m=S.setup.inCh;return m==='all'||(m==='1'&&ch===0)||(m==='13'&&(ch===0||ch===2))}
let pedalLast=0,pedalDown=false;
function onMidiIn(e){
  const d=e.data,st=d[0];
  if(st===0xF8){Clock.ext();return} if(st===0xFA){Clock.extStart();return} if(st===0xFC){return} if(st>=0xF0)return;
  if(UI.monVisible)mon('←',d);
  const t=st&0xF0,ch=st&15;
  if(!inputAccepts(ch))return;
  if(t===0x90&&d[2]>0){
    if(S.cmdKeys&&d[1]<=24){command(d[1]);return}
    Engine.noteOn(d[1],d[2],'hw');
  }else if(t===0x80||t===0x90){
    if(S.cmdKeys&&d[1]<=24)return;
    Engine.noteOff(d[1],'hw');
  }else if(t===0xB0){
    if(d[1]===64){const down=d[2]>=64;
      engineChannels().forEach(c=>cc(c,64,d[2]));
      if(down&&!pedalDown&&Pager.open){const n=now();if(n-pedalLast<380){Pager.turn(1);pedalLast=0}else pedalLast=n}
      else if(down&&!pedalDown&&S.pedal){const n=now();if(n-pedalLast<380){Looper.pedal();pedalLast=0}else pedalLast=n}
      pedalDown=down;
    }else if(d[1]===1){engineChannels().forEach(c=>cc(c,1,d[2]))}
  }else if(t===0xE0){const v=d[1]|(d[2]<<7);engineChannels().forEach(c=>bend(c,v))}
}
function engineChannels(){return[...LAYER_IDS.filter((id,i)=>S.layers[i].on).map(id=>CH[id]),CH.harm]}

/* keyboard command zone (A0, A#0, B0, C1) */
function command(n){
  if(n===21){Scenes.step(-1)}else if(n===22){Scenes.step(1)}
  else if(n===23){S.arp.on=!S.arp.on;if(!S.arp.on)Arp.clear();toast('Arpeggiator '+(S.arp.on?'ON':'off'));syncUI()}
  else if(n===24){Looper.pedal()}
}

/* =====================================================================
   MUSIC THEORY: key + chord detection
   ===================================================================== */
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10],lydian:[0,2,4,6,7,9,11],phrygian:[0,1,3,5,7,8,10],harmonic:[0,2,3,5,7,8,11],pentaMaj:[0,2,4,7,9],pentaMin:[0,3,5,7,10],blues:[0,3,5,6,7,10],wholetone:[0,2,4,6,8,10]};
const SCALE_LABEL={major:'Major',minor:'Minor',dorian:'Dorian',mixolydian:'Mixolydian',lydian:'Lydian',phrygian:'Phrygian',harmonic:'Harmonic minor',pentaMaj:'Pentatonic major',pentaMin:'Pentatonic minor',blues:'Blues',wholetone:'Whole tone'};
const KMAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],KMIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const CHORDS=[['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['dim',[0,3,6]],['dim7',[0,3,6,9]],['m7♭5',[0,3,6,10]],['aug',[0,4,8]],['sus2',[0,2,7]],['sus4',[0,5,7]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['add9',[0,2,4,7]],['9',[0,2,4,7,10]],['maj9',[0,2,4,7,11]],['m9',[0,2,3,7,10]],['7sus4',[0,5,7,10]],['5',[0,7]]];
function corr(a,b){const ma=a.reduce((s,x)=>s+x,0)/12,mb=b.reduce((s,x)=>s+x,0)/12;let n=0,da=0,db=0;for(let i=0;i<12;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return da&&db?n/Math.sqrt(da*db):0}
const Theory={hist:new Array(12).fill(0),held:new Map(),key:{root:0,mode:'major',conf:0},chord:null,count:0,
  on(n,v){this.held.set(n,v);for(let i=0;i<12;i++)this.hist[i]*=0.985;this.hist[n%12]+=0.4+v/127+(n<S.split?0.4:0);this.count++;this.detectKey();this.detectChord()},
  off(n){this.held.delete(n);this.detectChord()},
  detectKey(){let best=-2,root=0,mode='major';for(let r=0;r<12;r++){const rot=i=>this.hist[(i+r)%12];const arr=[...Array(12)].map((_,i)=>rot(i));
    const a=corr(arr,KMAJ),b=corr(arr,KMIN);if(a>best){best=a;root=r;mode='major'}if(b>best){best=b;root=r;mode='minor'}}
    this.key={root,mode,conf:best};if(this.count>=6)$('#keyName').textContent=`Key: ${NN[root]} ${mode}  ·  ${Math.round(clamp(best,0,1)*100)}% sure`},
  detectChord(){const notes=[...this.held.keys()].sort((a,b)=>a-b);const el=$('#chordName');
    if(!notes.length){return}
    const pcs=new Set(notes.map(n=>n%12)),bass=notes[0]%12;
    if(pcs.size===1){el.textContent=noteName(notes[0]);this.chord=null;return}
    let best=null,bs=-1e9;
    for(const r of pcs)for(const[suf,iv]of CHORDS){const tones=iv.map(i=>(r+i)%12);const miss=tones.filter(t=>!pcs.has(t));
      let ok=miss.length===0;let pen=0;if(!ok&&miss.length===1&&miss[0]===(r+7)%12&&iv.length>=4&&(iv.includes(10)||iv.includes(11))){ok=true;pen=8}
      if(!ok)continue;const extra=[...pcs].filter(p=>!tones.includes(p)).length;const sc=iv.length*10-extra*9-pen+(r===bass?4:0);
      if(sc>bs){bs=sc;best={root:r,suf,iv,bass}}}
    if(best){const nm=NN[best.root]+best.suf+(best.bass!==best.root?'/'+NN[best.bass]:'');if(el.textContent!==nm)Stats.chord(NN[best.root]+best.suf);this.chord=best;el.textContent=nm;Aura.chord(best);Light.chord(best.root)}
    else{el.textContent=[...pcs].map(p=>NN[p]).join(' ')}
  },
  scale(){return this.key.mode==='minor'?SCALES.minor:SCALES.major}
};
function diatonic(n,d,root,scale){const rel=n-root,oct=Math.floor(rel/12),r=((rel%12)+12)%12;let idx=0;for(let i=0;i<scale.length;i++)if(scale[i]<=r)idx=i;
  const chroma=r-scale[idx],t=idx+d,len=scale.length,o2=oct+Math.floor(t/len),s=scale[((t%len)+len)%len];return root+o2*12+s+chroma}
function snapScale(n,root,scale){let best=n,bd=99;for(let k=-6;k<=6;k++){const m=n+k,r=(((m-root)%12)+12)%12;if(scale.includes(r)&&Math.abs(k)<bd){bd=Math.abs(k);best=m}}return best}

/* =====================================================================
   ENGINE — every note you play (keys, screen, voice) flows through here
   ===================================================================== */
const HV={'3a':['3rd ↑',2],'4a':['4th ↑',3],'5a':['5th ↑',4],'8a':['Oct ↑',7],'3b':['3rd ↓',-2],'6b':['6th ↓',-5],'8b':['Oct ↓',-7]};
function harmonyNotes(n){let root,scale;if(S.harm.key==='auto'){root=Theory.key.root;scale=Theory.scale()}else{root=+S.harm.key;scale=SCALES[S.harm.scale]||SCALES.major}
  return S.harm.voices.filter(v=>HV[v]).map(v=>diatonic(n,HV[v][1],root,scale)).filter(x=>x>=0&&x<=127&&x!==n)}
const LIVE_SRC={hw:1,screen:1,hum:1};
const Engine={held:new Map(),map:new Map(),swallowed:new Set(),
  // entry point for every note: hooks (games, macros…) → automation (chords, scale lock) → play
  noteOn(n,v,src){const k=src+':'+n;
    if(LIVE_SRC[src]){if(Hooks.input(n,v,src)){this.swallowed.add(k);return}}
    if(this.map.has(k))this.noteOff(n,src);
    const gen=LIVE_SRC[src]?Auto.transform(n,v,src):null;
    if(!gen){this.map.set(k,[[n,src]]);this.play(n,v,src);return}
    const subs=gen.map((x,i)=>[x.n,src+'>'+n+'#'+i]);this.map.set(k,subs);gen.forEach((x,i)=>this.play(x.n,x.v,subs[i][1]))},
  noteOff(n,src){const k=src+':'+n;if(this.swallowed.delete(k))return;const subs=this.map.get(k);if(!subs)return;this.map.delete(k);subs.forEach(([m,s])=>this.stop(m,s));if(LIVE_SRC[src])Auto.release(n)},
  play(n,v,src){const key=src+':'+n;if(this.held.has(key))this.stop(n,src);
    const outs=[];
    S.layers.forEach((L,i)=>{if(!L.on||v<L.velLo||v>L.velHi)return;if(L.zone==='left'&&n>=S.split)return;if(L.zone==='right'&&n<S.split)return;
      const o=n+L.oct*12+L.semi;if(o<0||o>127)return;const c=CH[LAYER_IDS[i]];noteOn(c,o,v);outs.push([c,o])});
    if(S.harm.on)harmonyNotes(n).forEach(x=>{noteOn(CH.harm,x,v*0.85);outs.push([CH.harm,x])});
    this.held.set(key,outs);
    KB.lit(n,true,src);Viz.note(-1,n,v);Light.note(n,v);Theory.on(n,v);Arp.add(n,v);Echo.trigger(n,v);Looper.record('on',n,v);Mind.hear(n,v);Aura.activity();Drums.noteStart();Auto.energy(v);
  },
  stop(n,src){const key=src+':'+n,outs=this.held.get(key);if(!outs)return;this.held.delete(key);outs.forEach(([c,o])=>noteOff(c,o));
    KB.lit(n,false,src);Theory.off(n);Arp.remove(n);Looper.record('off',n,0);Mind.release();Aura.activity()},
  allOff(){[...this.map.keys()].forEach(k=>{const i=k.lastIndexOf(':');this.noteOff(+k.slice(i+1),k.slice(0,i))});[...this.held.keys()].forEach(k=>{const i=k.lastIndexOf(':');this.stop(+k.slice(i+1),k.slice(0,i))});this.swallowed.clear()}
};

/* =====================================================================
   CLOCK (24 ppq) — follows the keyboard's style tempo when it sends clock
   ===================================================================== */
const Clock={tick:0,last:now(),extLast:0,extTimes:[],extTempo:0,
  tickMs(){return 60000/((this.isExt()&&this.extTempo?this.extTempo:S.tempo)*24)},
  isExt(){return now()-this.extLast<400},
  poll(){if(this.isExt()){this.last=now();return}const n=now(),tm=this.tickMs();if(n-this.last>500)this.last=n-tm;
    while(n-this.last>=tm){this.last+=tm;if(S.setup.clockOut&&MIDI.out){try{MIDI.out.send([0xF8])}catch(e){}}this.doTick()}},
  doTick(){this.tick++;Arp.tick(this.tick);Drums.tick(this.tick);if(this.tick%6===0)Cond.step16();if(this.tick%24===0)beat()},
  ext(){const n=now();this.extTimes.push(n);if(this.extTimes.length>49)this.extTimes.shift();
    if(this.extTimes.length>24){const span=(this.extTimes[this.extTimes.length-1]-this.extTimes[0])/(this.extTimes.length-1);this.extTempo=Math.round(60000/(span*24))}
    const wasExt=this.isExt();this.extLast=n;if(!wasExt){this.tick=0;toast('⏱ Following the keyboard\'s tempo')}this.doTick()},
  extStart(){this.tick=-1;Drums.step=0;Arp.step=0;Cond.reset()}
};
setInterval(()=>Clock.poll(),4);
function beat(){const d=$('#beatDot');d.classList.add('on');setTimeout(()=>d.classList.remove('on'),90);
  const tv=$('#tempoVal');tv.firstChild.nodeValue=Clock.isExt()&&Clock.extTempo?Clock.extTempo:S.tempo;tv.lastChild.textContent=Clock.isExt()?'EXT SYNC':'BPM'}
function beatMs(){return Clock.tickMs()*24}
function setTempo(t){S.tempo=clamp(Math.round(t),30,280);$('#tempoVal').firstChild.nodeValue=S.tempo}

/* =====================================================================
   ARPEGGIATOR
   ===================================================================== */
const RATE={'1/4':24,'1/8':12,'1/8T':8,'1/16':6,'1/16T':4,'1/32':3};
const EUCLID=[1,0,1,1,0,1,1,0];
let arpOrder=0;
const Arp={notes:[],phys:new Set(),step:0,
  add(n,v){if(S.arp.latch&&this.phys.size===0)this.notes=[];if(!this.notes.length)this.step=0;this.phys.add(n);if(!this.notes.find(x=>x.n===n))this.notes.push({n,v,t:arpOrder++})},
  remove(n){this.phys.delete(n);if(!S.arp.latch)this.notes=this.notes.filter(x=>x.n!==n)},
  clear(){this.notes=this.notes.filter(x=>this.phys.has(x.n))},
  seq(){const pat=S.arp.pattern;const base=this.notes.slice().sort(pat==='played'?(a,b)=>a.t-b.t:(a,b)=>a.n-b.n);
    const ex=[];for(let o=0;o<S.arp.oct;o++)base.forEach(x=>ex.push({n:x.n+12*o,v:x.v}));
    if(pat==='down')return ex.reverse();
    if(pat==='updown')return ex.length<3?ex:ex.concat(ex.slice(1,-1).reverse());
    if(pat==='spiral'){const r=[];let i=0,j=ex.length-1;while(i<=j){r.push(ex[i++]);if(i<=j)r.push(ex[j--])}return r}
    return ex},
  tick(t){if(!S.arp.on||!this.notes.length)return;const per=RATE[S.arp.rate]||12;if(t%per)return;
    const stepMs=per*Clock.tickMs(),gate=Math.max(25,stepMs*S.arp.gate),k=this.step++,pat=S.arp.pattern;
    if(pat==='euclid'&&!EUCLID[k%8])return;
    let notes;if(pat==='chord'){const o=(k%S.arp.oct)*12;notes=this.notes.map(x=>({n:x.n+o,v:x.v}))}
    else{const s=this.seq();notes=[pat==='random'?pick(s):s[k%s.length]]}
    notes.forEach(x=>{if(x.n>127)return;const v=clamp(x.v*(k%4===0?1.08:0.92),1,127);noteOn(CH.arp,x.n,v);later(gate,()=>noteOff(CH.arp,x.n))})}
};

/* =====================================================================
   SHIMMER ECHO — repeats that climb, fall or sparkle
   ===================================================================== */
const ECHO_SHIFTS=[['0','Straight'],['12','Shimmer ↑ oct'],['-12','Fall ↓ oct'],['7','Fifth spiral'],['5','Fourth climb'],['scale','Scale ladder'],['sparkle','Sparkle']];
const Echo={trigger(n,v){if(!S.echo.on)return;const dt=S.echo.time*beatMs();let note=n;
  for(let i=1;i<=S.echo.repeats;i++){const vel=v*Math.pow(S.echo.fb,i);if(vel<5)break;const sh=S.echo.shift;
    if(sh==='scale')note=diatonic(n,i,Theory.key.root,Theory.scale());
    else if(sh==='sparkle')note=snapScale(n+12+Math.floor(rnd(0,13)),Theory.key.root,Theory.scale());
    else{note=n+(+sh)*i;while(note>108)note-=24;while(note<21)note+=24}
    const nn=note,d=dt*i;later(d,()=>{noteOn(CH.echo,nn,vel);later(Math.max(40,dt*0.85),()=>noteOff(CH.echo,nn))})}}};

/* =====================================================================
   ECHO MIND — listens to your phrase, then improvises an answer
   ===================================================================== */
const Mind={phrase:[],trans:{},ivPool:[],ioiPool:[],timer:null,resp:[],respNotes:new Set(),state:'',
  setState(s){this.state=s;$('#mindState').textContent=S.mind.on?s:''},
  hear(n,v){if(!S.mind.on)return;if(S.mind.polite)this.cancel();clearTimeout(this.timer);this.phrase.push({n,v,t:now()});if(this.phrase.length>32)this.phrase.shift();this.setState('🧠 listening…')},
  release(){if(!S.mind.on)return;clearTimeout(this.timer);if(Engine.held.size===0&&this.phrase.length)this.timer=setTimeout(()=>this.respond(),S.mind.wait)},
  learn(p){for(let i=1;i<p.length;i++){const iv=p[i].n-p[i-1].n;this.ivPool.push(iv);this.ioiPool.push(p[i].t-p[i-1].t);
      if(i>1){const prev=p[i-1].n-p[i-2].n;(this.trans[prev]=this.trans[prev]||[]).push(iv)}}
    if(this.ivPool.length>300){this.ivPool.splice(0,100);this.ioiPool.splice(0,100)}},
  respond(){const p=this.phrase;this.phrase=[];if(p.length<2){this.setState('🧠 play a phrase, then pause');return}
    this.learn(p);const cr=S.mind.creativity,root=Theory.key.root,scale=Theory.scale();
    const len=clamp(p.length+Math.round(rnd(-1,2.5)),3,16);
    let cur=Math.random()<0.5?p[0].n:p[p.length-1].n,prevIv=p.length>1?p[1].n-p[0].n:2;const start=cur;
    const iois=p.slice(1).map((x,i)=>x.t-p[i].t);if(Math.random()<cr*0.6)iois.reverse();
    const out=[];let t=0;
    for(let i=0;i<len;i++){
      if(i>0){let iv=pick(this.trans[prevIv]||this.ivPool);
        if(Math.random()<cr){iv=pick([-iv,iv+pick([-2,-1,1,2]),pick([-4,-3,-2,2,3,4,5,7])])}
        let nx=cur+iv;if(nx>start+12)nx-=12;if(nx<start-12)nx+=12;nx=snapScale(nx,root,scale);prevIv=nx-cur;cur=nx}
      let ioi=iois.length?iois[i%iois.length]:250;if(Math.random()<cr*0.4)ioi*=pick([0.5,2]);ioi=clamp(ioi,90,900);
      const v=clamp((p[i%p.length].v)*rnd(0.75,0.95),20,120);
      out.push({n:cur,v,t,d:Math.min(ioi*0.9,600)});t+=ioi}
    if(cr<0.75){const last=out[out.length-1];const targets=[root,root+7].flatMap(r=>[r+48,r+60,r+72]);last.n=targets.reduce((a,b)=>Math.abs(b-last.n)<Math.abs(a-last.n)?b:a);last.d*=2}
    this.setState('🎶 answering…');
    out.forEach((x,i)=>{this.resp.push(setTimeout(()=>{noteOn(CH.mind,x.n,x.v);this.respNotes.add(x.n);
      this.resp.push(setTimeout(()=>{noteOff(CH.mind,x.n);this.respNotes.delete(x.n);if(i===out.length-1)this.setState('🧠 your turn')},x.d))},x.t+150))})},
  cancel(){this.resp.forEach(clearTimeout);this.resp=[];this.respNotes.forEach(n=>noteOff(CH.mind,n));this.respNotes.clear()}
};

/* =====================================================================
   AURA — a pad that shadows whatever chord you hold
   ===================================================================== */
const Aura={notes:[],timer:null,last:'',
  chord(c){if(!S.aura.on)return;const sig=c.root+c.suf;if(sig===this.last)return;this.last=sig;
    const v=[36+c.root];if(c.iv.length>1)v.push(48+c.root);c.iv.slice(1).forEach(i=>{let n=60+((c.root+i)%12);if(n>70)n-=12;v.push(n)});
    const next=[...new Set(v)];this.notes.filter(n=>!next.includes(n)).forEach(n=>noteOff(CH.aura,n));next.filter(n=>!this.notes.includes(n)).forEach(n=>noteOn(CH.aura,n,78));this.notes=next},
  activity(){if(!S.aura.on)return;clearTimeout(this.timer);if(Engine.held.size===0)this.timer=setTimeout(()=>this.stop(),S.aura.hold*1000)},
  stop(){this.notes.forEach(n=>noteOff(CH.aura,n));this.notes=[];this.last=''}
};

/* =====================================================================
   LOOPER — 3 tracks, first loop sets the length (snapped to beats)
   ===================================================================== */
const Looper={tracks:[0,1,2].map(i=>({id:'loop'+(i+1),ev:[],st:'empty',mute:false,act:new Set(),recHeld:new Map(),master:false})),L:0,t0:0,lastAbs:0,running:true,
  cycle(){return this.L?Math.floor((now()-this.t0)/this.L):0},
  press(i){const T=this.tracks[i];
    if(T.st==='empty'){T.st=this.L?'rec':'armed';if(T.st==='rec')toast('Overdubbing Loop '+(i+1));else toast('Loop '+(i+1)+' armed — starts with your first note')}
    else if(T.st==='armed'){T.st='empty'}
    else if(T.st==='rec'){this.closeRec(T)}
    else if(T.st==='play'){T.st='rec';toast('Overdub Loop '+(i+1))}
    UI.renderLoops&&UI.renderLoops()},
  closeRec(T){const n=now();
    if(T.master&&!this.L){const dur=n-this.t0,b=beatMs();const beats=Math.max(1,Math.round(dur/b));this.L=beats*b;
      T.ev.forEach(e=>{e.cyc=Math.floor(e.t/this.L);e.t=e.t%this.L});toast(`Loop length ${beats} beats`);this.lastAbs=n;this.running=true}
    const pos=this.L?((n-this.t0)%this.L):0;T.recHeld.forEach((v,note)=>T.ev.push({t:pos,type:'off',n:note,cyc:this.cycle()}));T.recHeld.clear();T.st='play';T.master=false},
  record(type,n,v){const tn=now();
    this.tracks.forEach(T=>{
      if(T.st==='armed'&&type==='on'&&!this.L){T.st='rec';T.master=true;this.t0=tn;UI.renderLoops&&UI.renderLoops()}
      if(T.st!=='rec')return;
      let t=this.L?((tn-this.t0)%this.L+this.L)%this.L:tn-this.t0,cyc=this.cycle();
      if(type==='on'){if(S.loops.quant){const g=beatMs()/4,q=Math.round(t/g)*g;T.recHeld.set(n,q-t);t=q}else T.recHeld.set(n,0)}
      else{if(!T.recHeld.has(n))return;t+=T.recHeld.get(n);T.recHeld.delete(n)}
      if(this.L){if(t>=this.L){t-=this.L;cyc++}if(t<0){t+=this.L;cyc--}}else t=Math.max(0,t);
      T.ev.push({t,type,n,v,cyc})})},
  tickLoop(){const n=now();if(!this.L||!this.running){this.lastAbs=n;return}const a=this.lastAbs,L=this.L;this.lastAbs=n;if(n-a>500)return;
    this.tracks.forEach(T=>{if(T.mute||!(T.st==='play'||T.st==='rec'))return;const ch=CH[T.id];
      T.ev.forEach(e=>{const k=Math.ceil((a-this.t0-e.t)/L),occ=this.t0+k*L+e.t;if(occ>=n||occ<a)return;if(k===e.cyc)return;
        if(e.type==='on'){if(T.act.has(e.n))noteOff(ch,e.n);noteOn(ch,e.n,e.v);T.act.add(e.n)}else if(T.act.has(e.n)){noteOff(ch,e.n);T.act.delete(e.n)}})})},
  silence(T){T.act.forEach(n=>noteOff(CH[T.id],n));T.act.clear()},
  clear(i){const T=this.tracks[i];this.silence(T);T.ev=[];T.st='empty';T.recHeld.clear();T.master=false;if(this.tracks.every(x=>x.st==='empty'||x.st==='armed')){this.L=0}UI.renderLoops&&UI.renderLoops()},
  toggleMute(i){const T=this.tracks[i];T.mute=!T.mute;if(T.mute)this.silence(T);UI.renderLoops&&UI.renderLoops()},
  toggleRun(){this.running=!this.running;if(!this.running)this.tracks.forEach(T=>this.silence(T));else{this.t0=now();this.lastAbs=now()}UI.renderLoops&&UI.renderLoops()},
  pedal(){this.press(S.loops.sel)}
};
setInterval(()=>Looper.tickLoop(),10);

const DROWS=[['Kick',36],['Snare',38],['Clap',39],['C.Hat',42],['O.Hat',46],['Lo Tom',45],['Hi Tom',50],['Crash',49]];
const DPRESETS={
 Pop:['x.......x.x.....','....x.......x...','','x.x.x.x.x.x.x.x.','','','','x...............'],
 'Hip-Hop':['x......x..x.....','....x.......x...','','x.xxx.x.x.xxx.x.','','','',''],
 House:['x...x...x...x...','','....x.......x...','x.x.x.x.x.x.x.x.','..x...x...x...x.','','',''],
 Rock:['x......xx.x.....','....x.......x...','','x.x.x.x.x.x.x.x.','','','','x...............'],
 Bossa:['x..xx..xx..xx..x','x..x..x...x..x..','','xxxxxxxxxxxxxxxx','','','',''],
 Trap:['x......x......x.','........x.......','........x.......','xxxxxxxx.x.xxxxx','','','',''],

const Drums={playing:false,step:0,cells:[],
  tick(t){if(!this.playing||t%6)return;const st=this.step;this.step=(this.step+1)%16;
    const sw=(st%2===1)?S.drums.swing*Clock.tickMs()*6*0.6:0;
    later(sw,()=>{DROWS.forEach(([,n],r)=>{if(S.drums.grid[r][st]){const v=st%4===0?118:st%2===0?96:82;noteOn(9,n,v);later(70,()=>noteOff(9,n))}});this.show(st)})},
  show(st){if(!UI.loopsVisible)return;this.cells.forEach((row)=>row.forEach((c,i)=>c.classList.toggle('ph',i===st)))},

  noteStart(){if(S.drums.syncStart&&!this.playing&&S.drums.grid.some(r=>r.some(Boolean))){this.start()}},

  random(){const g=emptyGrid();for(let i=0;i<16;i++){g[0][i]=i===0||(i%4===0&&Math.random()<.6)||Math.random()<.12?1:0;g[1][i]=(i===4||i===12)?1:Math.random()<.07?1:0;
    g[3][i]=Math.random()<(i%2?0.45:0.85)?1:0;g[4][i]=!g[3][i]&&Math.random()<.12?1:0;g[2][i]=Math.random()<.05?1:0;g[5][i]=i>11&&Math.random()<.2?1:0;g[6][i]=i>11&&!g[5][i]&&Math.random()<.2?1:0}
    g[7][0]=Math.random()<.5?1:0;S.drums.grid=g;UI.syncDrums()}
};

/* =====================================================================
   SCENES + MORPH
   ===================================================================== */
const SCENE_KEYS=['tempo','split','parts','layers','arp','harm','echo','mind','aura','drums','xyMode','fx','auto'];
const MORPH_KEYS=['vol','pan','cutoff','res','atk','dec','rel','vibRate','vibDepth','vibDelay','rev','cho','detune'];
const Scenes={cur:-1,morphing:null,
  snap(){const o={};SCENE_KEYS.forEach(k=>o[k]=clone(S[k]));return o},
  save(i){SCENES[i]=this.snap();persistScenes();this.cur=i;renderScenes();toast('Saved scene '+(i+1))},
  load(i){const sc=SCENES[i];if(!sc)return;this.stopMorph();SCENE_KEYS.forEach(k=>{if(sc[k]!==undefined)S[k]=deepMerge(defaults()[k],clone(sc[k]))});
    this.cur=i;applyAll();syncUI();renderScenes();toast('Scene '+(i+1))},
  step(d){const filled=SCENES.map((s,i)=>s?i:-1).filter(i=>i>=0);if(!filled.length){toast('No scenes saved yet');return}
    let idx=filled.indexOf(this.cur);idx=idx<0?0:(idx+d+filled.length)%filled.length;this.load(filled[idx])},
  stopMorph(){if(this.morphing){clearTimeout(this.morphing.raf);this.morphing=null}},
  apply(sc){this.stopMorph();SCENE_KEYS.forEach(k=>{if(sc[k]!==undefined)S[k]=deepMerge(defaults()[k],clone(sc[k]))});applyAll();syncUI()},
  morph(i){const target=SCENES[i];if(!target)return;this.morphTo(target,secsLabel=>`scene ${i+1}`,i)},
  morphTo(target,_lbl,i=-1,secsOverride,quiet){this.stopMorph();const from=this.snap(),secs=secsOverride||S.morphSecs,t0=now();
    target=deepMerge(from,clone(target));
    // layers turning on fade in from silence; layers turning off fade out
    const volFrom={},volTo={};LAYER_IDS.forEach((id,li)=>{volFrom[id]=from.layers[li].on?from.parts[id].vol:0;volTo[id]=target.layers[li].on?target.parts[id].vol:0;
      if(!from.layers[li].on&&target.layers[li].on){S.parts[id].prog=target.parts[id].prog;S.parts[id].msb=target.parts[id].msb;S.parts[id].lsb=target.parts[id].lsb;S.parts[id].vol=0;applyPart(id);S.layers[li].on=true}});
    let switched=false;if(!quiet)toast(i>=0?`Morphing to scene ${i+1} over ${secs}s…`:`Morphing over ${secs}s…`);
    const stepFn=()=>{const p=clamp((now()-t0)/(secs*1000),0,1),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      PART_IDS.forEach(id=>{MORPH_KEYS.forEach(k=>{let a=from.parts[id][k],b=target.parts[id][k];if(k==='vol'&&id in volFrom){a=volFrom[id];b=volTo[id]}
        const v=Math.round(lerp(a,b,e));if(S.parts[id][k]!==v){S.parts[id][k]=v;sendParam(id,k)}})});
      setTempo(lerp(from.tempo,target.tempo,e));
      if(!switched&&p>=0.5){switched=true;PART_IDS.forEach(id=>{const tp=target.parts[id],sp=S.parts[id];if(tp.prog!==sp.prog||tp.msb!==sp.msb||tp.lsb!==sp.lsb){sp.prog=tp.prog;sp.msb=tp.msb;sp.lsb=tp.lsb;applyPart(id)}});
        ['arp','harm','echo','mind','aura','drums','split','auto'].forEach(k=>S[k]=clone(target[k]));pc(9,S.drums.kit);syncUI()}
      if(p<1)this.morphing.raf=setTimeout(stepFn,30);
      else{this.morphing=null;S.layers=clone(target.layers);S.xyMode=target.xyMode||S.xyMode;PART_IDS.forEach(id=>Object.assign(S.parts[id],clone(target.parts[id])));this.cur=i;renderScenes();syncUI();if(!quiet)toast(i>=0?'Arrived at scene '+(i+1):'Morph complete')}};
    this.morphing={raf:setTimeout(stepFn,0)}}
};
let sceneMode='';
function renderScenes(){const w=$('#scenes');w.innerHTML='';w.className='scenes'+(sceneMode?' '+sceneMode:'');
  SCENES.forEach((s,i)=>{const b=h('button',{class:'scn'+(s?' has':'')+(Scenes.cur===i?' cur':'')},String(i+1));
    b.onclick=()=>{if(sceneMode==='save'){Scenes.save(i);setSceneMode('')}else if(sceneMode==='morph'){if(!s){toast('Empty slot');return}Scenes.morph(i);setSceneMode('')}else if(s)Scenes.load(i);else toast('Empty — tap SAVE then a number')};w.append(b)})}
function setSceneMode(m){sceneMode=sceneMode===m?'':m;$('#saveMode').classList.toggle('on',sceneMode==='save');$('#morphMode').classList.toggle('on',sceneMode==='morph');renderScenes()}

/* =====================================================================
   XY PAD + TILT
   ===================================================================== */
const XY={x:.5,y:.5,down:false,spring:null};
const XY_MODES=[['vector','Vector Mix'],['filter','Filter'],['bend','Bend + Vibe'],['space','Space']];
function applyXY(x,y,force){XY.x=clamp(x,0,1);XY.y=clamp(y,0,1);const d=$('#xydot');d.style.left=XY.x*100+'%';d.style.top=XY.y*100+'%';

const UPD=[];
function syncUI(){UPD.forEach(f=>{try{f()}catch(e){}});labelXY();$('#tempoVal').firstChild.nodeValue=S.tempo}
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
function range({label,min,max,step=1,get,set,fmt=v=>v}){const val=h('span',{class:'rv'}),inp=h('input',{type:'range',min,max,step});
  const upd=()=>{const v=get();inp.value=v;val.textContent=fmt(v)};inp.addEventListener('input',()=>{const v=+inp.value;val.textContent=fmt(v);set(v)});UPD.push(upd);upd();
  return h('label',{class:'rng'},h('span',{class:'rl'},label),inp,val)}
function toggle(label,get,set,style){const b=h('button',{class:'tog',style:style||''},label);const upd=()=>b.classList.toggle('on',!!get());b.onclick=()=>{set(!get());upd()};UPD.push(upd);upd();return b}
function chips(opts,get,set,multi){const w=h('div',{class:'chips'});const upd=()=>[...w.children].forEach(c=>c.classList.toggle('on',multi?get().includes(c.dataset.v):String(get())===c.dataset.v));
  opts.forEach(([v,l])=>{const c=h('button',{class:'chip','data-v':String(v)},l);c.onclick=()=>{if(multi){const a=get().slice(),i=a.indexOf(String(v));i>=0?a.splice(i,1):a.push(String(v));set(a)}else set(v);upd()};w.append(c)});UPD.push(upd);upd();return w}
function selectEl(opts,get,set){const s=h('select');opts.forEach(([v,l])=>s.append(h('option',{value:v},l)));const upd=()=>{s.value=String(get())};s.onchange=()=>set(s.value);UPD.push(upd);upd();return s}
function voiceSelect(get,set){const s=h('select',{class:'vsel'});FAM.forEach((f,fi)=>{const g=h('optgroup',{label:f});for(let i=0;i<8;i++){const p=fi*8+i;g.append(h('option',{value:p},(p+1)+'  '+GM[p]))}s.append(g)});
  const upd=()=>{s.value=String(get())};s.onchange=()=>set(+s.value);UPD.push(upd);upd();return s}
function partVoice(id){return voiceSelect(()=>S.parts[id].prog,v=>{const p=S.parts[id];p.prog=v;p.msb=0;p.lsb=0;applyPart(id);labelXY();testPart(id,true)})}
function card(title,color,...kids){return h('div',{class:'card',style:color?'--c:'+color:''},h('div',{class:'ch'},...[].concat(title)),...kids)}
const hint=t=>h('div',{class:'hint'},t);
const c64=v=>(v>64?'+':'')+(v-64);
function testPart(id,short){const c=CH[id];const seq=short?[60,67]:[60,64,67,72,76];seq.forEach((n,i)=>later(i*130,()=>{noteOn(c,n,92);later(short?220:400,()=>noteOff(c,n))}));if(!short)later(seq.length*130+80,()=>{[60,64,67,71].forEach(n=>{noteOn(c,n,80);later(900,()=>noteOff(c,n))})})}

function mutate(p,amt){SOUND_KEYS.forEach(k=>{if(k==='porta'){if(Math.random()<amt*.3)p.porta=p.porta?0:Math.round(rnd(10,60));return}

  SOUND_KEYS.forEach(k=>{const r=Math.random();child.p[k]=r<.4?a.p[k]:r<.8?b.p[k]:Math.round((a.p[k]+b.p[k])/2)});
  const tmp={...child.p};mutate(tmp,.12);child.p=tmp;LIB.unshift(child);persistLib();libSel=[];UI.renderLib();loadSound(child);toast('Born: '+child.name+' ('+GM[child.prog]+')')}

  const pager=card('Hands-free Page Turner','#7dff4f',hint('Open sheet music (PDF or photos) full-screen. Turn pages without letting go of the keys: double-tap the sustain pedal, or press the very top keys — C8 = next, B7 = back. In landscape it shows two pages side by side.'),
    h('div',{class:'row'},h('button',{class:'big tog on',style:'--c:#7dff4f',onclick:()=>fin.click()},'📄 Open sheet music'),h('button',{onclick:()=>Pager.show()},'Reopen'),toggle('Two-page spread',()=>Pager.spread,v=>{Pager.spread=v})),fin);
  // Radio
  const radio=card(['Dream Radio',h('span',{class:'sp'}),h('button',{onclick:()=>Radio.stop()},'■ Off')],'#b48cff',hint('Endless music composed live by PRISM and played on your piano — chords, melody and band, always changing. For sleep, study, dinner or just listening to your own instrument.'),
    h('div',{class:'chips'},...Object.entries(RADIO).map(([k,r])=>{const b=h('button',{class:'chip pbtn','data-r':k,onclick:()=>Radio.start(k)},r.l);return b})),
    h('div',{class:'row'},h('label',{},'Sleep timer'),chips([[0,'Off'],[15,'15 min'],[30,'30'],[60,'60']],()=>Radio.endAt?Math.round((Radio.endAt-now())/60000/15)*15||15:0,v=>Radio.sleep(+v))),h('div',{class:'hint',id:'radioState'}));
  UI.syncRadio=()=>{$$('[data-r]').forEach(b=>b.classList.toggle('on',Radio.on&&Radio.mood===b.dataset.r));const s=$('#radioState');if(s)s.textContent=Radio.on?'On air: '+RADIO[Radio.mood].l+' · key of '+NN[+S.auto.key]+(Radio.endAt?' · sleep timer running':''):''};
  // Alarm
  const tin=h('input',{type:'time',class:'tin'});tin.value=Alarm.time||'07:00';const ast=h('div',{class:'hint'});
  UI.syncAlarm=()=>{const parts=[];if(Alarm.time)parts.push('⏰ Alarm '+Alarm.time);if(Alarm.timerEnd){const s=Math.max(0,Math.round((Alarm.timerEnd-now())/1000));parts.push(`⏱ ${Alarm.pomo?Alarm.phase+' ':''}${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} left`)}ast.textContent=parts.join('  ·  ')||'Nothing set'};
  setInterval(()=>{if(UI.tab==='beyond')UI.syncAlarm()},1000);
  const alarm=card('Piano Alarm & Practice Timer','#ffd84f',hint('Wake up to music that composes itself and slowly gets louder — play any key on the piano to turn it off. Or time your practice with a bell from the piano (Pomodoro: 25 min practice, 5 min break).'),
    h('div',{class:'row'},tin,h('button',{onclick:()=>Alarm.set(tin.value)},'Set alarm'),h('button',{onclick:()=>Alarm.set('')},'Clear'),h('button',{onclick:()=>Alarm.ring()},'Test')),
    h('div',{class:'row'},...[5,10,15,25].map(m=>h('button',{class:'chip',onclick:()=>Alarm.startTimer(m,false)},m+' min')),h('button',{class:'chip',onclick:()=>Alarm.startTimer(25,true)},'🍅 Pomodoro'),h('button',{class:'chip',onclick:()=>Alarm.stopTimer()},'Stop')),ast);
  // Calm
  const calm=card(['Calm Breathing',h('span',{class:'sp'}),h('button',{onclick:()=>Calm.on?Calm.stop():Calm.start()},'Start / Stop')],'#8cb4ff',hint('A guided breathing exercise: the piano rises as you breathe in and falls as you breathe out (4 in · 4 hold · 6 out).'),
    h('div',{class:'calmbox'},h('div',{id:'calmDot'}),h('div',{id:'calmTx'},'Tap Start for a 2-minute reset'),h('div',{id:'calmCyc',class:'hint'},'')));
  // Macros
  const mlist=h('div');UI.renderMacros=()=>{mlist.innerHTML='';Macros.list.forEach((M,i)=>{const nm=h('input',{type:'text',placeholder:'Name',value:M.name,class:'tin',style:'width:90px'});nm.onchange=()=>{M.name=nm.value;Macros.save()};
    const act=h('select');MACRO_ACTIONS.forEach(([v,l])=>act.append(h('option',{value:v},l)));act.value=M.action;
    const url=h('input',{type:'url',placeholder:'https://… webhook link',value:M.url||'',class:'tin',style:'flex:1;min-width:140px;display:'+(M.action==='webhook'?'block':'none')});url.onchange=()=>{M.url=url.value.trim();Macros.save()};
    act.onchange=()=>{M.action=act.value;Macros.save();url.style.display=M.action==='webhook'?'block':'none'};
    mlist.append(h('div',{class:'row',style:'border-top:1px solid var(--line);padding-top:6px'},nm,h('button',{class:Macros.learning===i?'tog on':'',onclick:()=>Macros.learn(i)},Macros.learning===i?'Listening…':(M.trig.length?'🎹 '+M.trig.map(noteName).join(' '):'🎹 Set code')),act,url,h('button',{onclick:()=>Macros.fire(i)},'Test')))})};
  const macros=card('Piano Macros · secret chords that do things','#ff5f7a',hint('Teach PRISM a 4-note code. Whenever you play it, something happens — start the radio, launch the light show, or call a web link to switch on smart lights, a fan or a playlist (works with IFTTT, Home Assistant, Zapier and other webhook services).'),mlist);
  UI.renderMacros();
  // Stats
  const sbox=h('div',{id:'statsBox'});
  const stats=card(['Practice Stats',h('span',{class:'sp'}),h('button',{onclick:()=>{if(confirm('Reset practice stats?')){localStorage.removeItem('prism.stats');Stats.d=null;Stats.load();UI.renderStats()}}},'Reset')],'#3dffc8',hint('Your playing, tracked automatically: daily minutes, streak, the keys you use most and your favourite chords.'),sbox);
  // Light
  const light=card('Light Show','#ffffff',hint('Turns the tablet into a full-screen light that blooms with every note and shifts colour with your chords. Cast it to a TV for a party, or dim the room for a concert vibe. Tap the screen to exit.'),
    h('button',{class:'big tog on',style:'--c:#fff',onclick:()=>Light.open()},'💡 Start light show'));
  t.append(h('div',{class:'grid'},games,msg,pager,radio,alarm,macros,calm,stats,light))}
UI.renderStats=()=>{const el=$('#statsBox');if(!el)return;const d=Stats.d,td=d.days[Stats.day()]||{ms:0,notes:0};el.innerHTML='';
  const tile=(v,l)=>h('div',{class:'tile'},h('b',{},v),h('span',{},l));
  el.append(h('div',{class:'tiles'},tile(Math.round(td.ms/60000)+'m','today'),tile(Stats.streak()+'🔥','day streak'),tile(td.notes,'notes today'),tile(d.notes,'notes ever')));
  const days=[];for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const k=Stats.day(dt);days.push([dt.toLocaleDateString(undefined,{weekday:'short'}),Math.round(((d.days[k]||{}).ms||0)/60000)])}
  const mx=Math.max(1,...days.map(x=>x[1]));el.append(h('div',{class:'bars'},...days.map(([l,m])=>h('div',{},h('i',{style:`height:${m/mx*100}%`}),h('span',{},l),h('small',{},m+'m')))));
  let km=1;for(let n=21;n<=108;n++)km=Math.max(km,d.keys[n]||0);el.append(h('div',{class:'hint',style:'margin:8px 0 2px'},'Your keys (A0 → C8)'),h('div',{class:'heat'},...[...Array(88)].map((_,i)=>h('i',{style:`opacity:${.12+.88*((d.keys[i+21]||0)/km)}`}))));
  const top=Object.entries(d.chords).sort((a,b)=>b[1]-a[1]).slice(0,6);el.append(h('div',{class:'hint',style:'margin-top:8px'},'Favourite chords: '+(top.map(([c,n])=>`${c} (${n})`).join(' · ')||'play some chords!')))};

/* ---------- header ---------- */
function buildHeader(){$('#connBtn').onclick=()=>{if(MIDI.out)showTab('setup');else connectMIDI()};
  $('#tDown').onclick=()=>setTempo(S.tempo-1);$('#tUp').onclick=()=>setTempo(S.tempo+1);
  let taps=[];$('#tapBtn').onclick=()=>{const n=now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>=2){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setTempo(60000/iv)}};
  $('#saveMode').onclick=()=>setSceneMode('save');$('#morphMode').onclick=()=>setSceneMode('morph');$('#panic').onclick=panic;renderScenes()}

/* ---------- boot ---------- */
buildHeader();buildStage();buildAuto();buildFusion();buildLab();buildPerform();buildLoops();buildMagic();buildBeyond();buildSetup();buildRail();
$('#pgPrev').onclick=()=>Pager.turn(-1);$('#pgNext').onclick=()=>Pager.turn(1);$('#pgClose').onclick=()=>Pager.close();
(()=>{const box=$('#pgBox');let sx=null;box.addEventListener('pointerdown',e=>{sx=e.clientX});box.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>50)Pager.turn(dx<0?1:-1);else{const r=box.getBoundingClientRect();Pager.turn(e.clientX>r.left+r.width/2?1:-1)}})})();
window.addEventListener('keydown',e=>{if(!Pager.open)return;if(['ArrowRight','PageDown',' '].includes(e.key)){Pager.turn(1);e.preventDefault()}else if(['ArrowLeft','PageUp'].includes(e.key)){Pager.turn(-1);e.preventDefault()}else if(e.key==='Escape')Pager.close()});
$('#light').onclick=()=>Light.close();$('#alStop').onclick=()=>Alarm.dismiss();$('#alSnooze').onclick=()=>Alarm.snooze();
initXY();Viz.init();KB.init();setTempo(S.tempo);labelXY();syncUI();
try{if(localStorage.getItem('prism.autoconnect')==='1'&&navigator.requestMIDIAccess)connectMIDI()}catch(e){}
if(!window.isSecureContext)toast('⚠ Open PRISM over https:// (or localhost) — Chrome only allows MIDI on secure pages.',6000);
else if(!localStorage.getItem('prism.autoconnect'))setTimeout(()=>toast('Tap “Connect” (top left) to link your DGX-660'),600);
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
